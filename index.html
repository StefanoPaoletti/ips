<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etichette Ottica Paoletti - Ritaglia PDF UPS</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/downloadjs@1.4.7/download.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f8f9fa; }
        h1 { color: #333; }
        #dropZone {
            border: 3px dashed #007bff;
            border-radius: 12px;
            padding: 60px 20px;
            margin: 30px auto;
            max-width: 600px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        #dropZone.dragover { background: #e7f3ff; border-color: #0056b3; }
        #status { margin: 20px; font-weight: bold; color: #555; min-height: 1.5em; }
        button { padding: 12px 30px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <h1>Ritaglia Etichetta UPS per Dymo 4XL (104×159 mm)</h1>
    <p>Trascina il PDF A4 qui (o clicca)</p>

    <div id="dropZone">
        <p>Trascina il file PDF qui<br>o clicca per sfogliare</p>
        <input type="file" id="pdfInput" accept=".pdf">
    </div>

    <div id="status"></div>
    <button id="processBtn" disabled onclick="processPdf()">Taglia e Scarica</button>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('pdfInput');
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        let selectedFile = null;

        ['dragover', 'dragenter'].forEach(e => dropZone.addEventListener(e, ev => {
            ev.preventDefault();
            dropZone.classList.add('dragover');
        }));

        ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, ev => {
            ev.preventDefault();
            dropZone.classList.remove('dragover');
        }));

        dropZone.addEventListener('drop', ev => {
            selectedFile = ev.dataTransfer.files[0];
            handleFile();
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', ev => {
            selectedFile = ev.target.files[0];
            handleFile();
        });

        function handleFile() {
            if (selectedFile?.type === 'application/pdf') {
                status.textContent = `File: ${selectedFile.name}`;
                processBtn.disabled = false;
            } else {
                status.textContent = 'Carica un PDF valido!';
                processBtn.disabled = true;
            }
        }

        async function processPdf() {
            if (!selectedFile) return;
            processBtn.disabled = true;
            status.textContent = 'Elaborazione in corso...';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                if (srcDoc.getPageCount() < 1) throw new Error('PDF senza pagine');

                const tgtDoc = await PDFLib.PDFDocument.create();

                // Copia la pagina (usa copyPages per evitare embed issues)
                const [srcPage] = await tgtDoc.copyPages(srcDoc, [0]);

                // Dimensioni target (104×159 mm in punti)
                const mmToPt = 2.83464567;
                const tgtW = 104 * mmToPt;   // ≈294.8
                const tgtH = 159 * mmToPt;   // ≈450.7

                // Altezza approssimativa da tenere (bottom part) - regola qui!
                const labelHeightPt = 480;  // ← Prova 450–520 in base al risultato

                // Scala basata sulla larghezza piena (595 pt A4) e altezza label
                const srcW = srcPage.getWidth();  // 595
                const scale = Math.min(tgtW / srcW, tgtH / labelHeightPt);

                if (!isFinite(scale) || scale <= 0) throw new Error('Scala non valida');

                const scaledW = srcW * scale;
                const scaledH = labelHeightPt * scale;

                // Posizionamento: centra orizzontale, sposta in basso per mostrare solo la parte bassa
                const drawX = (tgtW - scaledW) / 2;
                const drawY = tgtH - scaledH;  // ← Sposta in fondo → mostra bottom

                const labelPage = tgtDoc.addPage([tgtW, tgtH]);

                labelPage.drawPage(srcPage, {
                    x: drawX,
                    y: drawY,
                    xScale: scale,
                    yScale: scale,
                });

                const pdfBytes = await tgtDoc.save();
                download(pdfBytes, 'etichetta_ritagliata_104x159.pdf', 'application/pdf');

                status.textContent = 'Fatto! Scaricato. Stampa con "Actual Size" sulla Dymo.';
                console.log('Successo - scale:', scale, 'drawY:', drawY);
            } catch (err) {
                console.error('Errore dettagliato:', err);
                status.textContent = 'Errore: ' + (err.message || 'Controlla console F12 per dettagli');
            } finally {
                processBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
