<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etichette Ottica Paoletti - Ritaglia PDF UPS</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/downloadjs@1.4.7/download.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f8f9fa; }
        h1 { color: #333; }
        #dropZone {
            border: 3px dashed #007bff;
            border-radius: 12px;
            padding: 60px 20px;
            margin: 30px auto;
            max-width: 600px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        #dropZone.dragover { background: #e7f3ff; border-color: #0056b3; }
        #status { margin: 20px; font-weight: bold; color: #555; min-height: 1.5em; }
        button { padding: 12px 30px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <h1>Ritaglia Etichetta UPS per Dymo 4XL (104×159 mm)</h1>
    <p>Trascina il PDF A4 qui sotto (o clicca per selezionare)</p>

    <div id="dropZone">
        <p>Trascina il file PDF qui<br>o clicca per sfogliare</p>
        <input type="file" id="pdfInput" accept=".pdf">
    </div>

    <div id="status"></div>
    <button id="processBtn" disabled onclick="processPdf()">Taglia e Scarica Etichetta</button>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('pdfInput');
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        let selectedFile = null;

        // Drag & drop
        ['dragover', 'dragenter'].forEach(evt => dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }));

        ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }));

        dropZone.addEventListener('drop', e => {
            selectedFile = e.dataTransfer.files[0];
            handleFile();
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', e => {
            selectedFile = e.target.files[0];
            handleFile();
        });

        function handleFile() {
            if (selectedFile?.type === 'application/pdf') {
                status.textContent = `File: ${selectedFile.name} – Pronto`;
                processBtn.disabled = false;
            } else {
                status.textContent = 'Solo PDF validi!';
                processBtn.disabled = true;
            }
        }

        async function processPdf() {
            if (!selectedFile) return;
            processBtn.disabled = true;
            status.textContent = 'Elaborazione...';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                if (srcDoc.getPageCount() === 0) throw new Error('PDF vuoto');

                const tgtDoc = await PDFLib.PDFDocument.create();

                // Copia la pagina originale
                const [page] = await tgtDoc.copyPages(srcDoc, [0]);

                // === CROP: impostiamo CropBox per tenere solo la parte bassa ===
                // Coordinate PDF: bottom-left è (0,0), top-right (595,842) per A4
                // L'etichetta è nella parte inferiore → crop da y=0 a y=altezza_desiderata
                const cropHeightPt = 480;   // ← REGOLA QUI (450–510) se esce tagliata o con spazio extra
                page.setCropBox(0, 0, 595, cropHeightPt);  // x, y_bottom, width, height

                // Dimensioni target label in punti
                const mm2pt = 2.83464567;
                const tgtWidth  = 104 * mm2pt;  // ~294.8
                const tgtHeight = 159 * mm2pt;  // ~450.7

                // Scala per fit (preserve aspect ratio)
                const srcWidth  = page.getWidth();   // ancora 595 (ma cropped in height)
                const srcHeight = page.getCropBox().height;  // ora = cropHeightPt
                const scale = Math.min(tgtWidth / srcWidth, tgtHeight / srcHeight);

                const drawWidth  = srcWidth  * scale;
                const drawHeight = srcHeight * scale;

                // Centra
                const drawX = (tgtWidth  - drawWidth)  / 2;
                const drawY = (tgtHeight - drawHeight) / 2;

                // Aggiungi pagina label e disegna
                const labelPage = tgtDoc.addPage([tgtWidth, tgtHeight]);
                labelPage.drawPage(page, {
                    x: drawX,
                    y: drawY,
                    xScale: scale,
                    yScale: scale,
                    // rotate: PDFLib.degrees(0),  // se serve ruota a 90: degrees(90) e inverti width/height
                });

                const pdfBytes = await tgtDoc.save();
                download(pdfBytes, 'etichetta_104x159_ritagliata.pdf', 'application/pdf');

                status.textContent = 'Fatto! Scaricato. Stampa in "Dimensione reale" / "Actual Size" sulla Dymo.';
            } catch (err) {
                console.error(err);
                status.textContent = 'Errore: ' + (err.message || 'Controlla console (F12)');
            } finally {
                processBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
