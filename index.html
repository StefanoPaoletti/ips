<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etichette Ottica Paoletti - Ritaglia PDF UPS</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/downloadjs@1.4.7/download.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f8f9fa; }
        h1 { color: #333; }
        #dropZone {
            border: 3px dashed #007bff;
            border-radius: 12px;
            padding: 60px 20px;
            margin: 30px auto;
            max-width: 600px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        #dropZone.dragover { background: #e7f3ff; border-color: #0056b3; }
        #status { margin: 20px; font-weight: bold; color: #555; min-height: 1.5em; }
        button { padding: 12px 30px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <h1>Ritaglia Etichetta UPS per Dymo 4XL (104×159 mm)</h1>
    <p>Trascina il PDF A4 qui sotto (o clicca per selezionare)</p>

    <div id="dropZone">
        <p>Trascina il file PDF qui<br>o clicca per sfogliare</p>
        <input type="file" id="pdfInput" accept=".pdf">
    </div>

    <div id="status"></div>
    <button id="processBtn" disabled onclick="processPdf()">Taglia e Scarica Etichetta</button>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('pdfInput');
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        let selectedFile = null;

        // Drag & drop
        ['dragover', 'dragenter'].forEach(evt => dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }));

        ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }));

        dropZone.addEventListener('drop', e => {
            selectedFile = e.dataTransfer.files[0];
            handleFile();
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', e => {
            selectedFile = e.target.files[0];
            handleFile();
        });

        function handleFile() {
            if (selectedFile && selectedFile.type === 'application/pdf') {
                status.textContent = `File pronto: ${selectedFile.name}`;
                processBtn.disabled = false;
            } else {
                status.textContent = 'Carica un PDF valido!';
                processBtn.disabled = true;
            }
        }

        async function processPdf() {
            if (!selectedFile) return;
            processBtn.disabled = true;
            status.textContent = 'Elaborazione in corso...';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer);

                const tgtDoc = await PDFLib.PDFDocument.create();

                // Embedda la pagina 0 del PDF sorgente → restituisce PDFEmbeddedPage[]
                const embeddedPages = await tgtDoc.embedPdf(arrayBuffer);  // o srcDoc se preferisci
                const embeddedPage = embeddedPages[0];  // prendiamo la prima (e unica) pagina

                // Dimensioni target in punti (104 mm × 159 mm)
                const mmToPt = 2.83464567;
                const tgtWidth  = 104 * mmToPt;   // ≈294.8 pt
                const tgtHeight = 159 * mmToPt;   // ≈450.7 pt

                // Altezza stimata della parte bassa da tenere (regola questo valore!)
                const labelHeightPt = 480;  // ← Prova tra 450 e 520 se non centra bene

                // Calcolo scala (basato su larghezza A4 595 pt)
                const scale = Math.min(tgtWidth / 595, tgtHeight / labelHeightPt);
                if (!isFinite(scale) || scale <= 0) throw new Error('Scala non valida');

                const scaledWidth  = 595 * scale;
                const scaledHeight = labelHeightPt * scale;

                // Posizionamento: centra X, sposta in basso per mostrare solo la parte etichetta
                const drawX = (tgtWidth - scaledWidth) / 2;
                const drawY = tgtHeight - scaledHeight;   // questo "taglia" virtualmente la parte alta

                const newPage = tgtDoc.addPage([tgtWidth, tgtHeight]);

                newPage.drawPage(embeddedPage, {
                    x: drawX,
                    y: drawY,
                    xScale: scale,
                    yScale: scale,
                });

                const pdfBytes = await tgtDoc.save();
                download(pdfBytes, 'etichetta_ritagliata_104x159.pdf', 'application/pdf');

                status.textContent = 'Successo! Etichetta scaricata. Stampa con "Actual Size" sulla Dymo.';
            } catch (err) {
                console.error(err);
                status.textContent = 'Errore: ' + (err.message || 'Controlla console (F12)');
            } finally {
                processBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
