<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etichette Ottica Paoletti - Ritaglia PDF UPS</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/downloadjs@1.4.7/download.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f8f9fa; }
        h1 { color: #333; }
        #dropZone {
            border: 3px dashed #007bff;
            border-radius: 12px;
            padding: 60px 20px;
            margin: 30px auto;
            max-width: 600px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        #dropZone.dragover { background: #e7f3ff; border-color: #0056b3; }
        #status { margin: 20px; font-weight: bold; color: #555; min-height: 1.5em; }
        button { padding: 12px 30px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <h1>Ritaglia Etichetta UPS per Dymo 4XL (104×159 mm)</h1>
    <p>Trascina il PDF A4 qui (o clicca per selezionare)</p>

    <div id="dropZone">
        <p>Trascina il file PDF qui<br>o clicca per sfogliare</p>
        <input type="file" id="pdfInput" accept=".pdf">
    </div>

    <div id="status"></div>
    <button id="processBtn" disabled onclick="processPdf()">Taglia e Scarica Etichetta</button>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('pdfInput');
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        let selectedFile = null;

        // Drag & drop
        ['dragover', 'dragenter'].forEach(evt => {
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', e => {
            selectedFile = e.dataTransfer.files[0];
            handleFileSelect();
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', e => {
            selectedFile = e.target.files[0];
            handleFileSelect();
        });

        function handleFileSelect() {
            if (selectedFile && selectedFile.type === 'application/pdf') {
                status.textContent = `File caricato: ${selectedFile.name}`;
                processBtn.disabled = false;
            } else {
                status.textContent = 'Carica un PDF valido!';
                processBtn.disabled = true;
            }
        }

        async function processPdf() {
            if (!selectedFile) return;
            processBtn.disabled = true;
            status.textContent = 'Elaborazione in corso...';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                if (srcDoc.getPageCount() === 0) throw new Error('PDF senza pagine');

                const tgtDoc = await PDFLib.PDFDocument.create();

                // Embed della pagina originale (modo corretto per drawPage)
                const [embeddedPage] = await tgtDoc.embedPdfPages(srcDoc, [0]);

                // Dimensioni target in punti
                const mmToPt = 2.83464567;
                const tgtWidth  = 104 * mmToPt;   // ≈294.8 pt
                const tgtHeight = 159 * mmToPt;   // ≈450.7 pt

                // Altezza approssimativa dell'etichetta (bottom part) - REGOLA QUI
                const labelHeightPt = 480;  // Prova 460-520 se il crop non è perfetto

                // Scala basata su larghezza A4 (595 pt) e altezza etichetta
                const srcWidth = embeddedPage.width;   // 595
                const scale = Math.min(tgtWidth / srcWidth, tgtHeight / labelHeightPt);

                if (!isFinite(scale) || scale <= 0) throw new Error('Errore nel calcolo della scala');

                const scaledWidth  = srcWidth * scale;
                const scaledHeight = labelHeightPt * scale;

                // Posizionamento: centra X, sposta verso il basso per mostrare solo bottom
                const drawX = (tgtWidth - scaledWidth) / 2;
                const drawY = tgtHeight - scaledHeight;  // negativo o basso → crop virtuale top

                const newPage = tgtDoc.addPage([tgtWidth, tgtHeight]);

                newPage.drawPage(embeddedPage, {
                    x: drawX,
                    y: drawY,
                    xScale: scale,
                    yScale: scale,
                });

                const pdfBytes = await tgtDoc.save();
                download(pdfBytes, 'etichetta_ritagliata_104x159.pdf', 'application/pdf');

                status.textContent = 'Fatto! File scaricato. Apri e stampa con "Dimensione reale" (Actual Size) sulla Dymo.';
            } catch (err) {
                console.error('Errore dettagliato:', err);
                status.textContent = 'Errore: ' + (err.message || 'Problema sconosciuto – premi F12 e guarda Console');
            } finally {
                processBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
