<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore Etichette Dymo 104x159mm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
            display: flex;
            align-items: center;
        }

        .header-compact {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
        }

        .header-specs {
            font-size: 14px;
            color: #666;
            display: flex;
            align-items: center;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .preview-container {
            display: none;
            margin-top: 30px;
        }

        .preview-container.show {
            display: block;
        }

        .preview-title-centered {
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 320px;
            margin-bottom: 15px;
        }

        .preview-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        #labelCanvas {
            border: 2px solid #dee2e6;
            border-radius: 5px;
            max-width: 100%;
            height: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .crop-controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .crop-controls h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }

        .control-actions {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-top: 20px;
        }

        .control-actions-left {
            display: flex;
            gap: 10px;
        }

        .btn-preset {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .btn-preset:hover {
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .control-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #dee2e6;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .value-display {
            min-width: 50px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-compact">
            <div class="header-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 8px;">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <strong>Convertitore Etichette Dymo</strong>
            </div>
            <div class="header-specs">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 5px;">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
                104mm × 159mm |
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin: 0 5px;">
                    <polyline points="6 9 6 2 18 2 18 9"/>
                    <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                </svg>
                Dymo LabelWriter 4XL
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="18" x2="12" y2="12"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
            </div>
            <p style="color: #666; font-size: 15px;">Clicca qui o trascina il file PDF</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Elaborazione in corso...</p>
        </div>

        <div class="crop-controls" id="cropControls" style="display: none;">
            <h3>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m7.848 8.25 1.536.887M7.848 8.25a3 3 0 1 1-5.196-3 3 3 0 0 1 5.196 3Zm1.536.887a2.165 2.165 0 0 1 1.083 1.839c.005.351.054.695.14 1.024M9.384 9.137l2.077 1.199M7.848 15.75l1.536-.887m-1.536.887a3 3 0 1 1-5.196 3 3 3 0 0 1 5.196-3Zm1.536-.887a2.165 2.165 0 0 0 1.083-1.838c.005-.352.054-.695.14-1.025m-1.223 2.863 2.077-1.199m0-3.328a4.323 4.323 0 0 1 2.068-1.379l5.325-1.628a4.5 4.5 0 0 1 2.48-.044l.803.215-7.794 4.5m-2.882-1.664A4.33 4.33 0 0 0 10.607 12m3.736 0 7.794 4.5-.802.215a4.5 4.5 0 0 1-2.48-.043l-5.326-1.629a4.324 4.324 0 0 1-2.068-1.379M14.343 12l-2.882 1.664" />
                </svg>
                Regola inquadratura
            </h3>
            
            <div class="control-group">
                <label>Zoom</label>
                <div class="control-row">
                    <input type="range" id="zoomLevel" min="50" max="300" value="100" step="5">
                    <span class="value-display" id="zoomValue">100%</span>
                </div>
            </div>

            <div class="control-group">
                <label>Pan Orizzontale</label>
                <div class="control-row">
                    <input type="range" id="panX" min="-50" max="50" value="0" step="1">
                    <span class="value-display" id="panXValue">0</span>
                </div>
            </div>

            <div class="control-group">
                <label>Pan Verticale</label>
                <div class="control-row">
                    <input type="range" id="panY" min="-50" max="50" value="0" step="1">
                    <span class="value-display" id="panYValue">0</span>
                </div>
            </div>

            <div class="control-actions">
                <div class="control-actions-left">
                    <button class="btn btn-preset" onclick="applyIPSPreset()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 5px;">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            <path d="M9 12l2 2 4-4"/>
                        </svg>
                        Preset IPS
                    </button>
                    <button class="btn" onclick="resetCrop()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 5px;">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
                        </svg>
                        Reset
                    </button>
                </div>
            </div>
        </div>

        <div class="preview-container" id="previewContainer">
            <div class="preview-title-centered">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 8px;">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                Anteprima etichetta 104×159mm
            </div>
            <div class="preview-box">
                <canvas id="labelCanvas"></canvas>
            </div>
            <div class="preview-actions">
                <button class="btn" onclick="downloadPDF()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 5px;">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Scarica PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        // Configurazione PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Dimensioni etichetta Dymo in mm
        const LABEL_WIDTH_MM = 104;
        const LABEL_HEIGHT_MM = 159;
        
        // Risoluzione per la stampa (DPI)
        const DPI = 300;
        const MM_TO_INCH = 0.0393701;
        
        // Dimensioni in pixel alla risoluzione di stampa
        const LABEL_WIDTH_PX = Math.round(LABEL_WIDTH_MM * MM_TO_INCH * DPI);
        const LABEL_HEIGHT_PX = Math.round(LABEL_HEIGHT_MM * MM_TO_INCH * DPI);

        let pdfDoc = null;
        let currentPage = null;
        let cropSettings = {
            zoom: 100,
            panX: 0,
            panY: 0
        };

        // Gestione upload
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const previewContainer = document.getElementById('previewContainer');
        const cropControls = document.getElementById('cropControls');

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                processFile(file);
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                processFile(file);
            }
        }

        async function processFile(file) {
            loading.classList.add('show');
            previewContainer.classList.remove('show');
            cropControls.style.display = 'none';

            try {
                const arrayBuffer = await file.arrayBuffer();
                pdfDoc = await pdfjsLib.getDocument(arrayBuffer).promise;
                currentPage = await pdfDoc.getPage(1);
                
                await renderLabel();
                
                loading.classList.remove('show');
                previewContainer.classList.add('show');
                cropControls.style.display = 'block';
            } catch (error) {
                console.error('Errore durante l\'elaborazione:', error);
                alert('Errore durante l\'elaborazione del PDF. Riprova.');
                loading.classList.remove('show');
            }
        }

        async function renderLabel() {
            const canvas = document.getElementById('labelCanvas');
            const ctx = canvas.getContext('2d');

            // Imposta dimensioni canvas
            canvas.width = LABEL_WIDTH_PX;
            canvas.height = LABEL_HEIGHT_PX;

            // Sfondo bianco
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render PDF ad alta risoluzione
            const viewport = currentPage.getViewport({ scale: 3.0 });
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = viewport.width;
            tempCanvas.height = viewport.height;

            await currentPage.render({
                canvasContext: tempCtx,
                viewport: viewport
            }).promise;

            // Calcola lo zoom
            const zoomFactor = cropSettings.zoom / 100;
            
            // Calcola la scala per adattare il PDF all'etichetta
            const scaleToFit = Math.min(
                canvas.width / tempCanvas.width,
                canvas.height / tempCanvas.height
            );
            
            // Applica zoom alla scala
            const finalScale = scaleToFit * zoomFactor;
            
            // Dimensioni scalate del PDF
            const scaledWidth = tempCanvas.width * finalScale;
            const scaledHeight = tempCanvas.height * finalScale;
            
            // Posizione base (centrato)
            let x = (canvas.width - scaledWidth) / 2;
            let y = (canvas.height - scaledHeight) / 2;
            
            // Applica pan (converti da -50/+50 a pixel effettivi)
            // Pan positivo = sposta l'immagine verso destra/basso
            // Pan negativo = sposta l'immagine verso sinistra/alto
            const panXPixels = (cropSettings.panX / 100) * canvas.width;
            const panYPixels = (cropSettings.panY / 100) * canvas.height;
            
            x += panXPixels;
            y += panYPixels;
            
            // Disegna il PDF scalato e posizionato
            ctx.drawImage(
                tempCanvas,
                0, 0, tempCanvas.width, tempCanvas.height,
                x, y, scaledWidth, scaledHeight
            );

            // Aggiorna l'anteprima (ridimensiona per visualizzazione)
            const maxDisplayWidth = 320;
            const displayScale = maxDisplayWidth / LABEL_WIDTH_PX;
            canvas.style.width = LABEL_WIDTH_PX * displayScale + 'px';
            canvas.style.height = LABEL_HEIGHT_PX * displayScale + 'px';
        }

        // Gestione controlli pan e zoom
        document.getElementById('zoomLevel').addEventListener('input', (e) => {
            cropSettings.zoom = parseInt(e.target.value);
            document.getElementById('zoomValue').textContent = cropSettings.zoom + '%';
            renderLabel();
        });

        document.getElementById('panX').addEventListener('input', (e) => {
            cropSettings.panX = parseInt(e.target.value);
            document.getElementById('panXValue').textContent = cropSettings.panX;
            renderLabel();
        });

        document.getElementById('panY').addEventListener('input', (e) => {
            cropSettings.panY = parseInt(e.target.value);
            document.getElementById('panYValue').textContent = cropSettings.panY;
            renderLabel();
        });

        function applyIPSPreset() {
            cropSettings = { zoom: 200, panX: 47, panY: -50 };
            
            document.getElementById('zoomLevel').value = 200;
            document.getElementById('panX').value = 47;
            document.getElementById('panY').value = -50;
            document.getElementById('zoomValue').textContent = '200%';
            document.getElementById('panXValue').textContent = 47;
            document.getElementById('panYValue').textContent = -50;
            
            renderLabel();
        }

        function resetCrop() {
            cropSettings = { zoom: 100, panX: 0, panY: 0 };
            
            document.getElementById('zoomLevel').value = 100;
            document.getElementById('panX').value = 0;
            document.getElementById('panY').value = 0;
            document.getElementById('zoomValue').textContent = '100%';
            document.getElementById('panXValue').textContent = 0;
            document.getElementById('panYValue').textContent = 0;
            
            renderLabel();
        }

        function downloadPDF() {
            const canvas = document.getElementById('labelCanvas');
            const imgData = canvas.toDataURL('image/jpeg', 1.0);

            const { jsPDF } = window.jspdf;
            
            // Crea PDF con dimensioni esatte dell'etichetta
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: [LABEL_WIDTH_MM, LABEL_HEIGHT_MM]
            });

            // Aggiungi immagine al PDF
            pdf.addImage(imgData, 'JPEG', 0, 0, LABEL_WIDTH_MM, LABEL_HEIGHT_MM);
            
            // Scarica
            pdf.save('etichetta-dymo-104x159.pdf');
        }
    </script>
</body>
</html>
