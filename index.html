<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etichette Ottica Paoletti - Ritaglia PDF UPS</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/downloadjs@1.4.7/download.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f8f9fa; }
        h1 { color: #333; }
        #dropZone {
            border: 3px dashed #007bff;
            border-radius: 12px;
            padding: 60px 20px;
            margin: 30px auto;
            max-width: 600px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        #dropZone.dragover { background: #e7f3ff; border-color: #0056b3; }
        #status { margin: 20px; font-weight: bold; color: #555; min-height: 1.5em; }
        button { padding: 12px 30px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <h1>Ritaglia Etichetta UPS per Dymo 4XL (104×159 mm)</h1>
    <p>Trascina il PDF A4 qui sotto (o clicca per selezionare)</p>

    <div id="dropZone">
        <p>Trascina il file PDF qui<br>o clicca per sfogliare</p>
        <input type="file" id="pdfInput" accept=".pdf">
    </div>

    <div id="status"></div>
    <button id="processBtn" disabled onclick="processPdf()">Taglia e Scarica Etichetta</button>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('pdfInput');
        const processBtn = document.getElementById('processBtn');
        const status = document.getElementById('status');
        let selectedFile = null;

        // Drag & drop styling
        ['dragover', 'dragenter'].forEach(evt => dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }));

        ['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }));

        dropZone.addEventListener('drop', e => {
            selectedFile = e.dataTransfer.files[0];
            handleFileSelect();
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', e => {
            selectedFile = e.target.files[0];
            handleFileSelect();
        });

        function handleFileSelect() {
            if (selectedFile && selectedFile.type === 'application/pdf') {
                status.textContent = `File pronto: ${selectedFile.name}`;
                processBtn.disabled = false;
            } else {
                status.textContent = 'Carica un file PDF valido!';
                processBtn.disabled = true;
            }
        }

        async function processPdf() {
            if (!selectedFile) return;
            processBtn.disabled = true;
            status.textContent = 'Elaborazione in corso...';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const sourceDoc = await PDFLib.PDFDocument.load(arrayBuffer);

                if (sourceDoc.getPageCount() === 0) throw new Error('PDF senza pagine!');

                const targetDoc = await PDFLib.PDFDocument.create();

                // Copia la pagina 0 (l'unica nel tuo caso)
                const [copiedPage] = await targetDoc.copyPages(sourceDoc, [0]);

                // Dimensioni target in punti (precisione mm → pt)
                const mmToPt = 2.83464567;
                const targetW = 104 * mmToPt;   // ≈294.8 pt
                const targetH = 159 * mmToPt;   // ≈450.7 pt

                // Altezza da tenere (bottom part): regola qui se l'etichetta è tagliata o ha troppo spazio
                const cropH = 480;  // ← Prova valori tra 450 e 510 se necessario

                // Scala per far entrare la porzione bassa nel target (preserve aspect)
                const origW = copiedPage.getWidth();     // 595 pt A4
                const scale  = Math.min(targetW / origW, targetH / cropH);

                const scaledW = origW * scale;
                const scaledH = cropH * scale;

                // Centra
                const drawX = (targetW - scaledW) / 2;
                const drawY = (targetH - scaledH) / 2;

                // Crea pagina target e disegna SOLO la porzione bassa
                const newPage = targetDoc.addPage([targetW, targetH]);

                newPage.drawPage(copiedPage, {
                    x: drawX,
                    y: drawY,
                    width: scaledW,          // ← Limita la larghezza disegnata
                    height: scaledH,         // ← Limita l'altezza disegnata (effettua il crop verticale)
                    // Se vuoi ruotare di 90°: rotate: PDFLib.degrees(90), e inverti targetW/targetH + calcoli
                });

                const pdfBytes = await targetDoc.save();
                download(pdfBytes, 'etichetta_ritagliata_104x159.pdf', 'application/pdf');

                status.textContent = 'Successo! File scaricato. Stampa con "Actual Size" / "Dimensione reale" sulla Dymo.';
            } catch (err) {
                console.error(err);
                status.textContent = 'Errore: ' + (err.message || 'problema sconosciuto – controlla console (F12)');
            } finally {
                processBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
